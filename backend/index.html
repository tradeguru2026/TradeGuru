<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeGuru</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #17202a;
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .tagline {
      font-size: 12px;
      margin-top: 4px;
      color: #cbd5e1;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 16px;
    }

    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 16px;
      outline: none;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    }

    .stock-name {
      font-size: 20px;
      font-weight: bold;
    }

    .symbol {
      color: #64748b;
      font-size: 13px;
      margin-top: 4px;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      margin-top: 12px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      flex: 1;
      border: none;
      padding: 14px;
      border-radius: 9px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .buy {
      background: #16a34a;
    }

    .sell {
      background: #dc2626;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin: 20px 0 10px;
    }

    .status {
      background: #ecfdf5;
      color: #15803d;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .notice {
      background: #fff7ed;
      color: #9a3412;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      font-size: 13px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #64748b;
    }

    .footer {
      text-align: center;
      padding: 25px 10px;
      color: #64748b;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">📈 TradeGuru</div>
    <div class="tagline">Smart trading dashboard</div>
  </div>

  <div class="container">

    <input
      class="search"
      type="text"
      id="search"
      placeholder="Search stock e.g. Reliance"
      onkeyup="searchStock()"
    >

    <div class="status">
      ● Trading API: Connected &nbsp; | &nbsp; Mode: PAPER
    </div>

    <div id="stockList">
      <div class="loading">Loading stocks...</div>
    </div>

    <div class="section-title">
      Quick Info
    </div>

    <div class="card">
      <p>📊 Market Watch</p>
      <p style="margin-top:8px;">
        TradeGuru watchlist is connected to the API.
      </p>
    </div>

    <div class="notice">
      ⚠️ Paper trading mode is active. Orders shown here do not use real money.
    </div>

  </div>

  <div class="footer">
    © 2026 TradeGuru
  </div>

  <script>

    let stocks = [];

    async function loadStocks() {

      try {

        const response = await fetch('/api/watchlist');

        if (!response.ok) {
          throw new Error('API error');
        }

        stocks = await response.json();

        displayStocks(stocks);

      } catch (error) {

        document.getElementById('stockList').innerHTML =
          '<div class="card">Unable to load watchlist.</div>';

      }

    }

    function displayStocks(list) {

      const stockList = document.getElementById('stockList');

      if (!list.length) {
        stockList.innerHTML =
          '<div class="card">No stocks in watchlist.</div>';
        return;
      }

      stockList.innerHTML = '';

      list.forEach(function(stock) {

        const card = document.createElement('div');

        card.className = 'card stock';

        card.setAttribute(
          'data-name',
          stock.name || stock.symbol || ''
        );

        const price =
          typeof stock.price === 'number'
            ? stock.price
            : Number(stock.price || 0);

        card.innerHTML = `
          <div class="stock-name">
            ${stock.name || 'Unknown Stock'}
          </div>

          <div class="symbol">
            ${stock.symbol || ''}
          </div>

          <div class="price">
            ₹${price.toLocaleString('en-IN', {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2
            })}
          </div>

          <div class="buttons">

            <button
              class="buy"
              onclick="trade('BUY', '${stock.symbol || stock.name}')">
              BUY
            </button>

            <button
              class="sell"
              onclick="trade('SELL', '${stock.symbol || stock.name}')">
              SELL
            </button>

          </div>
        `;

        stockList.appendChild(card);

      });

    }

    function searchStock() {

      const input = document
        .getElementById('search')
        .value
        .toLowerCase();

      const filtered = stocks.filter(function(stock) {

        const name =
          (stock.name || '').toLowerCase();

        const symbol =
          (stock.symbol || '').toLowerCase();

        return name.includes(input) ||
               symbol.includes(input);

      });

      displayStocks(filtered);

    }

    function trade(type, stock) {

      alert(
        type + ' order selected for ' +
        stock +
        ' (Paper Trading)'
      );

    }

    loadStocks();

  </script>

</body>
</html>
