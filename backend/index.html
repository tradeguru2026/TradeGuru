<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeGuru</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 20px;
    }

    .search {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 16px;
    }

    .status {
      background: #dcfce7;
      color: #166534;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .stock-name {
      font-size: 18px;
      font-weight: bold;
    }

    .symbol {
      color: #64748b;
      margin-top: 4px;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      margin-top: 12px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .buy {
      background: #16a34a;
    }

    .sell {
      background: #dc2626;
    }

    .section-title {
      font-size: 20px;
      font-weight: bold;
      margin: 25px 0 10px;
    }

    .notice {
      background: #fff7ed;
      color: #9a3412;
      padding: 14px;
      border-radius: 10px;
      margin-top: 15px;
      font-size: 13px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #64748b;
    }

    .footer {
      text-align: center;
      padding: 25px 10px;
      color: #64748b;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>📈 TradeGuru</h1>
    <div class="subtitle">Smart trading dashboard</div>

    <input
      id="search"
      class="search"
      type="text"
      placeholder="Search stock e.g. Reliance"
      oninput="searchStock()"
    >

    <div class="status">
      ● Trading API: Connected &nbsp; | &nbsp; Mode: PAPER
    </div>

    <div id="stockList">
      <div class="loading">Loading stocks...</div>
    </div>

    <div class="section-title">
      📊 Market Watch
    </div>

    <div class="card">
      <p>TradeGuru watchlist is connected to the API.</p>
    </div>

    <div class="notice">
      ⚠️ Paper trading mode is active. Orders shown here do not use real money.
    </div>

    <div class="footer">
      © 2026 TradeGuru
    </div>

  </div>

  <script>
    let stocks = [];

    async function loadStocks() {
      const stockList = document.getElementById("stockList");

      try {
        const response = await fetch("/api/watchlist");

        if (!response.ok) {
          throw new Error("API error");
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
          throw new Error("Invalid API response");
        }

        stocks = data;
        displayStocks(stocks);

      } catch (error) {
        stockList.innerHTML =
          '<div class="card">Unable to load watchlist.</div>';
      }
    }

    function displayStocks(list) {
      const stockList = document.getElementById("stockList");

      if (!list || list.length === 0) {
        stockList.innerHTML =
          '<div class="card">No stocks in watchlist.</div>';
        return;
      }

      stockList.innerHTML = "";

      list.forEach(function(stock) {

        const name = stock.name || "Unknown Stock";
        const symbol = stock.symbol || "";

        const price =
          typeof stock.price === "number"
            ? stock.price
            : Number(stock.price || 0);

        const card = document.createElement("div");
        card.className = "card stock";
        card.setAttribute("data-name", name.toLowerCase());
        card.setAttribute("data-symbol", symbol.toLowerCase());

        card.innerHTML = `
          <div class="stock-name">${name}</div>

          <div class="symbol">${symbol}</div>

          <div class="price">
            ₹${price.toLocaleString("en-IN", {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2
            })}
          </div>

          <div class="buttons">
            <button class="buy"
              onclick="trade('BUY', '${symbol || name}')">
              BUY
            </button>

            <button class="sell"
              onclick="trade('SELL', '${symbol || name}')">
              SELL
            </button>
          </div>
        `;

        stockList.appendChild(card);
      });
    }

    function searchStock() {
      const input = document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

      const filtered = stocks.filter(function(stock) {

        const name = (stock.name || "").toLowerCase();
        const symbol = (stock.symbol || "").toLowerCase();

        return name.includes(input) || symbol.includes(input);
      });

      displayStocks(filtered);
    }

    function trade(type, stock) {
      alert(
        type + " order selected for " +
        stock +
        " (Paper Trading)"
      );
    }

    loadStocks();
  </script>

</body>
</html>
